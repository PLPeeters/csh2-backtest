name: Refresh CSH2 data

on:
  schedule:
    - cron: '0 0 * * 2-6'
      timezone: Europe/Brussels
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run refresh-csh2
      - id: commit
        name: Commit refreshed CSH2 data
        run: |
          if git diff --quiet -- src/assets/data/csh2-prices.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/data/csh2-prices.json
          git commit -m 'chore: refresh CSH2 data'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
